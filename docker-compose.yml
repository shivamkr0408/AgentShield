# AgentShield: three services — the backend API, the dashboard (nginx), and Ollama.
#
#   docker compose up --build
#   docker compose exec ollama ollama pull qwen2.5:7b   # once, to fetch the local model
#
# Then open the dashboard at http://localhost:8080 (API docs at http://localhost:8000/docs).

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      AGENTSHIELD_MODEL_URL: http://ollama:11434
      AGENTSHIELD_MODEL_NAME: ${AGENTSHIELD_MODEL_NAME:-qwen2.5:7b}
      AGENTSHIELD_DB_URL: sqlite:////state/agentshield.db
      DEMO_MODE: ${DEMO_MODE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    volumes:
      - state:/state
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  ollama:
  state:
