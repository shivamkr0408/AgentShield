server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The decision stream: forward the WebSocket to the API with upgrade headers.
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # API routes go to the backend; everything else is the single-page dashboard.
    location ~ ^/(scan|check_action|incidents|events|approvals|policy|stats|results|config|health|docs|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
